<!doctype html>
<html lang="$LANGUAGE"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="x-apple-disable-message-reformatting"><title>$TITLE · $ISSUE_LABEL $NUMBER · $DATE</title>

<body style="margin:0;padding:0;background-color:#f4f6f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;background-color:#f4f6f4;"><tr><td class="outer-pad" align="center" style="padding:28px 16px;">

<p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#63686d;">$MINUTES $MINUTES_LABEL · $LINKS_EXTRA</p>
$SECTIONS
<p style="font-style:italic;color:#50565a;margin:24px 0;">$QUESTION</p>
<p style="border-top:1px solid #dce2dd;padding:23px 0 0;margin:0;">$SIGNATURE</p>
</td></tr></table>
